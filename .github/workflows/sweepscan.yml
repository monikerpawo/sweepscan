name: SweepScan

on:
  schedule:
    # Runs every 15 minutes, all day, every day. GitHub's scheduler is
    # best-effort and can lag a few minutes during busy periods - that's
    # normal and fine for this use case. Edit the cron expression below to
    # change how often it scans (all times are UTC).
    - cron: "*/15 * * * *"
  # Lets you trigger a run by hand from the Actions tab (Run workflow button)
  # any time you want to test it without waiting for the schedule.
  workflow_dispatch: {}

# Needed so the job can commit the updated state.json file back to the repo.
permissions:
  contents: write

concurrency:
  group: sweepscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SweepScan (single pass)
        env:
          SWEEPSCAN_TG_TOKEN: ${{ secrets.SWEEPSCAN_TG_TOKEN }}
          SWEEPSCAN_TG_CHAT_ID: ${{ secrets.SWEEPSCAN_TG_CHAT_ID }}
        run: python sweepscan_app.py --state state.json --config config.json

      - name: Commit updated state
        run: |
          git config user.name "sweepscan-bot"
          git config user.email "sweepscan-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update SweepScan state [skip ci]"
            git push
          fi
